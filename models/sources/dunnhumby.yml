      data_type: bigint
      description: 'Columna fuente: COUPON_UPC.'
      quote: true
    - name: PRODUCT_ID
      data_type: bigint
      description: 'Columna fuente: PRODUCT_ID.'
      quote: true
    - name: CAMPAIGN
      data_type: bigint
      description: 'Columna fuente: CAMPAIGN.'
      quote: true
  - name: coupon_redempt
    description: Eventos de canje por hogar, día, cupón y campaña; no se deduplican.
    columns:
