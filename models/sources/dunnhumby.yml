version: 2
sources:
- name: dunnhumby
  schema: staging
  description: Copias físicas en staging; conservan los nombres de columnas
    del CSV.
  tables:
  - name: campaign_desc
    description: Catálogo de campañas; grano esperado una campaña.
    columns:
    - name: DESCRIPTION
      data_type: text
      description: 'Columna fuente: DESCRIPTION.'
      quote: true
    - name: CAMPAIGN
      data_type: bigint
      description: 'Columna fuente: CAMPAIGN.'
      quote: true
    - name: START_DAY
      data_type: bigint
      description: 'Columna fuente: START_DAY.'
      quote: true
    - name: END_DAY
      data_type: bigint
      description: 'Columna fuente: END_DAY.'
      quote: true
  - name: campaign_table
    description: Asignaciones de hogares a campañas; grano hogar y campaña.
    columns:
    - name: DESCRIPTION
      data_type: text
      description: 'Columna fuente: DESCRIPTION.'
      quote: true
    - name: household_key
      data_type: bigint
      description: 'Columna fuente: household_key.'
      quote: true
    - name: CAMPAIGN
      data_type: bigint
      description: 'Columna fuente: CAMPAIGN.'
      quote: true
  - name: coupon
    description: Productos asociados a cupones y campañas; coupon_upc por sí solo
      no es único.
    columns:
