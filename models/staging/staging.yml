version: 2
models:
- name: stg_campaign_table
  description: Vista de staging administrada por dbt; conserva todas las asignaciones de hogares a campanas y sus valores originales.
  columns:
  - name: household_key
    data_type: bigint
    description: 'Columna fuente: household_key.'
  - name: campaign
    data_type: bigint
    description: 'Columna fuente: campaign.'
  - name: description
    data_type: text
    description: 'Columna fuente: description.'
- name: stg_hh_demographic
  description: Vista de staging administrada por dbt; conserva todos los perfiles y categorias originales, incluidas Unknown y None/Unknown.
  columns:
  - name: age_desc
    data_type: text
    description: 'Columna fuente: age_desc. Conserva los rangos como texto.'
  - name: marital_status_code
    data_type: text
    description: 'Columna fuente: marital_status_code.'
  - name: income_desc
    data_type: text
    description: 'Columna fuente: income_desc. Conserva los rangos como texto.'
  - name: homeowner_desc
    data_type: text
    description: 'Columna fuente: homeowner_desc. Conserva la categoria Unknown.'
  - name: hh_comp_desc
    data_type: text
    description: 'Columna fuente: hh_comp_desc. Conserva la categoria Unknown.'
  - name: household_size_desc
    data_type: text
    description: 'Columna fuente: household_size_desc. Conserva las categorias como texto.'
  - name: kid_category_desc
    data_type: text
    description: 'Columna fuente: kid_category_desc. Conserva None/Unknown sin reinterpretarla.'
  - name: household_key
    data_type: bigint
    description: 'Columna fuente: household_key.'
- name: stg_causal_data
  description: Vista de staging administrada por dbt; conserva los valores originales.
  columns:
  - name: product_id
    data_type: bigint
    description: 'Columna fuente: PRODUCT_ID.'
  - name: store_id
    data_type: integer
    description: 'Columna fuente: STORE_ID.'
  - name: week_number
    data_type: integer
    description: 'Columna fuente: WEEK_NO.'
  - name: display
    data_type: text
    description: 'Columna fuente: display.'
  - name: mailer
    data_type: text
    description: 'Columna fuente: mailer.'


- name: stg_transaction_data
  description: Vista de staging administrada por dbt; conserva los valores originales.
  columns:
  - name: household_key
    data_type: integer
    description: 'Columna fuente: household_key.'
  - name: basket_id
    data_type: bigint
    description: 'Columna fuente: BASKET_ID.'
  - name: transaction_day
    data_type: integer
    description: 'Columna fuente: DAY.'
  - name: product_id
    data_type: bigint
    description: 'Columna fuente: PRODUCT_ID.'
  - name: quantity
    data_type: integer
    description: 'Columna fuente: QUANTITY.'
  - name: sales_value
    data_type: numeric
    description: 'Columna fuente: SALES_VALUE.'
  - name: store_id
    data_type: integer
    description: 'Columna fuente: STORE_ID.'
  - name: retail_discount
    data_type: numeric
    description: 'Columna fuente: RETAIL_DISC.'
  - name: transaction_time_hhmm
    data_type: integer
    description: 'Columna fuente: TRANS_TIME.'
  - name: transaction_week
    data_type: integer
    description: 'Columna fuente: WEEK_NO.'
  - name: coupon_discount
    data_type: numeric
    description: 'Columna fuente: COUPON_DISC.'
  - name: coupon_match_discount
    data_type: numeric
    description: 'Columna fuente: COUPON_MATCH_DISC.'


- name: stg_campaign_descriptions
  description: Vista de staging con la descripción de campaña sin espacios externos.
  columns:
  - name: campaign_id
    data_type: integer
    description: Identificador de la campaña.
  - name: campaign_type
    data_type: text
    description: Descripción de la campaña con espacios externos eliminados.
  - name: start_day
    data_type: integer
    description: Día de inicio de la campaña.
  - name: end_day
    data_type: integer
    description: Día de finalización de la campaña.

- name: stg_coupon_redemptions
  description: Vista de staging de redenciones; conserva las filas originales.
  columns:
  - name: household_id
    data_type: integer
    description: Identificador del hogar.
  - name: redemption_day
    data_type: integer
    description: Día de la redención; proviene de DAY.
  - name: coupon_upc
    data_type: bigint
    description: Identificador UPC del cupón.
  - name: campaign_id
    data_type: integer
    description: Identificador de la campaña.
