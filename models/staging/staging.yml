version: 2
models:
- name: stg_campaign_table
  description: Vista de staging; estandariza nombres y tipos y conserva todas las filas y categorias originales.
  columns:
  - name: campaign_id
    data_type: integer
    description: 'Columna fuente: CAMPAIGN.'
  - name: household_id
    data_type: integer
    description: 'Columna fuente: household_key.'
  - name: campaign_type
    data_type: text
    description: 'Columna fuente: DESCRIPTION.'
- name: stg_hh_demographic
  description: Vista de staging; estandariza nombres y tipos y conserva todas las filas y categorias originales.
  columns:
  - name: household_id
    data_type: integer
    description: 'Columna fuente: household_key.'
    data_tests: [not_null, unique]
  - name: age_range
    data_type: text
    description: 'Columna fuente: AGE_DESC.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['19-24', '25-34', '35-44', '45-54', '55-64', '65+']
  - name: marital_status_code
    data_type: text
    description: 'Columna fuente: MARITAL_STATUS_CODE.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['A', 'B', 'U']
  - name: income_range
    data_type: text
    description: 'Columna fuente: INCOME_DESC.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['Under 15K', '15-24K', '25-34K', '35-49K', '50-74K', '75-99K', '100-124K', '125-149K', '150-174K', '175-199K', '200-249K', '250K+']
  - name: homeownership_status
    data_type: text
    description: 'Columna fuente: HOMEOWNER_DESC.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['Homeowner', 'Renter', 'Probable Owner', 'Probable Renter', 'Unknown']
  - name: household_composition
    data_type: text
    description: 'Columna fuente: HH_COMP_DESC.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['1 Adult Kids', '2 Adults Kids', '2 Adults No Kids', 'Single Female', 'Single Male', 'Unknown']
  - name: household_size_category
    data_type: text
    description: 'Columna fuente: HOUSEHOLD_SIZE_DESC.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['1', '2', '3', '4', '5+']
  - name: children_category
    data_type: text
    description: 'Columna fuente: KID_CATEGORY_DESC.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['1', '2', '3+', 'None/Unknown']
- name: stg_product
  description: >-
    Vista de siete columnas en minúscula. Conserva filas e identificadores;
    convierte únicamente textos vacíos en NULL y conserva las etiquetas originales.
  columns:
  - name: product_id
    data_type: bigint
    description: PRODUCT_ID original; no se genera otro identificador.
    data_tests: [not_null, unique]
  - name: manufacturer_id
    data_type: integer
    description: MANUFACTURER; rango observado de 1 a 6477.
    data_tests: [not_null]
  - name: department
    data_type: text
    description: Departamento en minúscula y sin espacios exteriores; vacío como NULL.
  - name: brand
    data_type: text
    description: Marca en minúscula y sin espacios exteriores; vacío como NULL.
  - name: category
    data_type: text
    description: COMMODITY_DESC en minúscula; conserva etiquetas y convierte vacíos en NULL.
  - name: subcategory
    data_type: text
    description: SUB_COMMODITY_DESC en minúscula; conserva etiquetas y convierte vacíos en NULL.
  - name: product_size
    data_type: text
    description: Tamaño y unidad como texto en minúscula; vacío como NULL, no cero.

- name: stg_coupon
  description: >-
    Asociaciones únicas cupón-producto-campaña. El UPC original se llama
    coupon_id para respetar nombre_id; no es único por sí solo. No inventa claves.
  columns:
  - name: coupon_id
    data_type: bigint
    description: COUPON_UPC; supera el rango de integer y conserva su valor original.
    data_tests: [not_null]
  - name: product_id
    data_type: bigint
    description: Producto al que aplica el cupón; mismo tipo que los modelos del equipo.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_product')
          field: product_id
  - name: campaign_id
    data_type: integer
    description: CAMPAIGN; rango observado de 1 a 30.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: source('dunnhumby_raw', 'campaign_desc')
          field: '"CAMPAIGN"'

- name: stg_causal_data
  description: Vista de staging administrada por dbt; conserva los valores originales.
  columns:
  - name: product_id
    data_type: bigint
    description: 'Columna fuente: PRODUCT_ID.'
  - name: store_id
    data_type: integer
    description: 'Columna fuente: STORE_ID.'
  - name: week_number
    data_type: integer
    description: 'Columna fuente: WEEK_NO.'
  - name: display
    data_type: text
    description: 'Columna fuente: display.'
  - name: mailer
    data_type: text
    description: 'Columna fuente: mailer.'


- name: stg_transaction_data
  description: Vista de staging administrada por dbt; conserva los valores originales.
  columns:
  - name: household_id
    data_type: integer
    description: 'Columna fuente: household_key.'
  - name: basket_id
    data_type: bigint
    description: 'Columna fuente: BASKET_ID.'
  - name: transaction_day
    data_type: integer
    description: 'Columna fuente: DAY.'
  - name: product_id
    data_type: bigint
    description: 'Columna fuente: PRODUCT_ID.'
  - name: quantity
    data_type: integer
    description: 'Columna fuente: QUANTITY.'
  - name: sales_value
    data_type: numeric
    description: 'Columna fuente: SALES_VALUE.'
  - name: store_id
    data_type: integer
    description: 'Columna fuente: STORE_ID.'
  - name: retail_discount
    data_type: numeric
    description: 'Columna fuente: RETAIL_DISC.'
  - name: transaction_time_hhmm
    data_type: integer
    description: 'Columna fuente: TRANS_TIME.'
  - name: transaction_week
    data_type: integer
    description: 'Columna fuente: WEEK_NO.'
  - name: coupon_discount
    data_type: numeric
    description: 'Columna fuente: COUPON_DISC.'
  - name: coupon_match_discount
    data_type: numeric
    description: 'Columna fuente: COUPON_MATCH_DISC.'


- name: stg_campaign_descriptions
  description: Vista de staging con la descripción de campaña sin espacios externos.
  columns:
  - name: campaign_id
    data_type: integer
    description: Identificador de la campaña.
  - name: campaign_type
    data_type: text
    description: Descripción de la campaña con espacios externos eliminados.
  - name: start_day
    data_type: integer
    description: Día de inicio de la campaña.
  - name: end_day
    data_type: integer
    description: Día de finalización de la campaña.

- name: stg_coupon_redemptions
  description: Vista de staging de redenciones; conserva las filas originales.
  columns:
  - name: household_id
    data_type: integer
    description: Identificador del hogar.
  - name: redemption_day
    data_type: integer
    description: Día de la redención; proviene de DAY.
  - name: coupon_upc
    data_type: bigint
    description: Identificador UPC del cupón.
  - name: campaign_id
    data_type: integer
    description: Identificador de la campaña.
