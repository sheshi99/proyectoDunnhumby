version: 2
models:
  - name: fact_sales
    description: >-
      Una fila por línea original de compra. Conserva medidas y signos de staging.
      Las campañas se analizan mediante los indicadores de contexto promocional.
      Las cuatro llaves son los IDs propios de las dimensiones, buscados con el
      código original de cada venta.
      Los descuentos siguen la guía de dunnhumby: retail_discount es el de la
      tarjeta de lealtad del comercio, coupon_discount el del cupón del fabricante
      y coupon_match_discount la igualación de ese cupón por parte del comercio.
      sales_value es lo que recibe el comercio, no lo que pagó el cliente.
      Las relaciones se comprueban con dbt test y restricciones FOREIGN KEY físicas.
    columns:
      - name: sale_detail_id
        description: Clave IDENTITY del warehouse; conserva las filas iguales y las correcciones reconocibles por sus campos originales.
        tests: [unique, not_null]
      - name: dim_product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: dim_product_id
      - name: dim_household_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_household')
                field: dim_household_id
      - name: dim_time_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: dim_time_id
      - name: dim_promotional_context_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_promotional_context')
                field: dim_promotional_context_id
