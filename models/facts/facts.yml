version: 2
models:
  - name: fact_sales
    description: >-
      Una fila por línea original de compra. Conserva medidas y signos de staging.
      Las campañas se analizan mediante los indicadores de contexto promocional.
      manufacturer_coupon_discount conserva coupon_match_discount de la fuente;
      el nombre responde al diagrama, no a una nueva interpretación del descuento.
      Las relaciones se comprueban con dbt test y restricciones FOREIGN KEY físicas.
    columns:
      - name: sale_detail_id
        description: Clave IDENTITY de la línea; puede cambiar al reconstruir.
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: household_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_household')
              field: household_id
      - name: time_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_id
      - name: promotional_context_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_promotional_context')
              field: promotional_context_id
