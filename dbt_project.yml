name: dunnhumby
version: "1.0.0"
config-version: 2

profile: dunnhumby

model-paths: ["models"]

# Solo carga CSV cuando se solicita expresamente en dbt build --target dev.
on-run-start:
  - "{{ cargar_csv_al_iniciar() }}"

clean-targets:
  - target
  - dbt_packages

models:
  dunnhumby:
    +materialized: view
    sincronizacion:
      +materialized: sincronizar_origen
